<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Códice del Torneo</title>
<meta name="description" content="Fichas de movimientos, remates y combos de cada luchador.">
<meta name="theme-color" content="#9b0d12">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Códice">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style id="css">:root{
  --desk:#1b1b1b; --desk-2:#2a0b0c;
  --win:#dedede; --win-2:#f2f2f2; --field:#ffffff;
  --pane-top:#5b5b5b; --pane-bot:#262626;
  --grp-head-a:#ffffff; --grp-head-b:#d6d6d6; --grp-body:#efefef; --grp-ink:#a3121a;
  --ink:#141414; --muted:#555555; --edge:#7a7a7a; --edge-soft:#b3b3b3;
  --red:#c4161c; --red-dark:#7d0a0e; --red-light:#ec5a4f; --sel-ink:#ffffff;
  --kick:#3a3a3a; --neutral:#8a8a8a; --coin-ink:#ffffff; --gold:#c4161c;
  --btn-a:#ffffff; --btn-b:#dcdcdc;
  --card-paper:#fbfaf7; --card-row:#e7e5e0; --card-ink:#151413; --card-bar:#151413; --card-bar-ink:#fbfaf7; --card-edge:#151413;
  --ui:Tahoma, Verdana, "Segoe UI", "DejaVu Sans", Geneva, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#000000; --desk-2:#220506;
    --win:#2a2a2a; --win-2:#1f1f1f; --field:#141414;
    --pane-top:#3a3a3a; --pane-bot:#121212;
    --grp-head-a:#4a4a4a; --grp-head-b:#2f2f2f; --grp-body:#232323; --grp-ink:#ff6b5e;
    --ink:#ececec; --muted:#a9a9a9; --edge:#5c5c5c; --edge-soft:#444444;
    --red:#c4161c; --red-dark:#6a080b; --red-light:#ff6b5e; --sel-ink:#ffffff;
    --kick:#5e5e5e; --neutral:#9a9a9a; --coin-ink:#ffffff; --gold:#ff6b5e;
    --btn-a:#4a4a4a; --btn-b:#2e2e2e;
    --card-paper:#ecebe6; --card-row:#d9d7d0; --card-ink:#151413; --card-bar:#0e0d0c; --card-bar-ink:#ecebe6; --card-edge:#0e0d0c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#000000; --desk-2:#220506;
  --win:#2a2a2a; --win-2:#1f1f1f; --field:#141414;
  --pane-top:#3a3a3a; --pane-bot:#121212;
  --grp-head-a:#4a4a4a; --grp-head-b:#2f2f2f; --grp-body:#232323; --grp-ink:#ff6b5e;
  --ink:#ececec; --muted:#a9a9a9; --edge:#5c5c5c; --edge-soft:#444444;
  --red:#c4161c; --red-dark:#6a080b; --red-light:#ff6b5e; --sel-ink:#ffffff;
  --kick:#5e5e5e; --neutral:#9a9a9a; --coin-ink:#ffffff; --gold:#ff6b5e;
  --btn-a:#4a4a4a; --btn-b:#2e2e2e;
  --card-paper:#ecebe6; --card-row:#d9d7d0; --card-ink:#151413; --card-bar:#0e0d0c; --card-bar-ink:#ecebe6; --card-edge:#0e0d0c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;font-family:var(--ui);font-size:15px;line-height:1.4;color:var(--ink);
  background:radial-gradient(ellipse at 50% 120%, var(--desk-2), var(--desk) 65%) fixed var(--desk)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:1px dotted var(--ink);outline-offset:2px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* window */
.desktop{padding:clamp(0px,2.5vw,28px)}
.window{max-width:1200px;margin:0 auto;border:3px solid var(--red-dark);border-top:0;border-radius:9px 9px 0 0;
  background:var(--win);box-shadow:0 12px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;min-height:calc(100vh - 5vw)}
.titlebar{display:flex;align-items:center;gap:.5rem;padding:.35rem .4rem .35rem .6rem;border-radius:8px 8px 0 0;margin:0 -3px;
  background:linear-gradient(180deg,#f07a6f 0%,#d42a22 7%,#b8141a 45%,#9b0d12 85%,#7d0a0e 100%);color:#fff;
  border:1px solid #5a0508;border-bottom:0}
.ticon{font-size:1.05rem}
.ttitle{flex:1;font-weight:700;font-size:1rem;text-shadow:1px 1px 0 rgba(0,0,0,.45);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtns{display:flex;gap:2px}
.tbtns i{display:grid;place-items:center;width:22px;height:22px;border:1px solid #fff;border-radius:3px;font-style:normal;font-weight:700;font-size:.8rem;
  background:linear-gradient(180deg,#e04a40,#a50f14);box-shadow:inset 0 0 2px rgba(255,255,255,.6)}
.tbtns i.x{background:linear-gradient(180deg,#5a5a5a,#1d1d1d)}
.toolbar{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;padding:.35rem .5rem;background:var(--win-2);border-bottom:1px solid var(--edge-soft)}
.toolbar .spacer{flex:1}
.xpbtn{border:1px solid var(--edge);border-radius:3px;padding:.25rem .8rem;cursor:pointer;
  background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--ink)}
.xpbtn:hover{box-shadow:inset 0 0 0 2px var(--red-light)}
.xpbtn:active{background:linear-gradient(180deg,var(--btn-b),var(--btn-a))}
.xpbtn[aria-pressed="true"]{background:var(--red);border-color:var(--red-dark);color:var(--sel-ink)}
.xpbtn.primary{border-color:var(--red-dark);font-weight:700}
.xpbtn.danger{color:var(--red-light);border-color:var(--red)}
.xpbtn:disabled{opacity:.55;cursor:default}

.body{display:block;flex:1;min-height:0}
.statusbar{display:flex;gap:4px;padding:3px;background:var(--win-2);border-top:1px solid var(--edge-soft);font-size:.8rem;color:var(--muted)}
.statusbar span{flex:1;padding:1px 6px;border:1px solid var(--edge-soft);border-right-color:var(--win);border-bottom-color:var(--win)}

/* task pane */
.taskpane{background:linear-gradient(180deg,var(--pane-top),var(--pane-bot));padding:10px 8px;overflow:auto;
  position:fixed;top:0;left:0;bottom:0;z-index:40;width:min(300px,86vw);
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  transform:translateX(-105%);visibility:hidden;transition:transform .22s ease, visibility 0s linear .22s;
  box-shadow:4px 0 24px rgba(0,0,0,.55);border-right:3px solid var(--red-dark)}
body.menu-open .taskpane{transform:none;visibility:visible;transition:transform .22s ease, visibility 0s}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .22s}
body.menu-open .scrim{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.taskpane,.scrim{transition:none}}
.tp-top{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px;padding:.3rem .5rem;border-radius:6px 6px 0 0;
  background:linear-gradient(180deg,#d42a22,#9b0d12);color:#fff;font-weight:700}
.tp-top button{display:grid;place-items:center;width:26px;height:24px;border:1px solid #fff;border-radius:3px;cursor:pointer;color:#fff;font-weight:700;
  background:linear-gradient(180deg,#5a5a5a,#1d1d1d)}
.hamb{display:grid;place-items:center;width:30px;height:26px;margin-right:.15rem;border:1px solid #fff;border-radius:3px;cursor:pointer;color:#fff;padding:0;
  background:linear-gradient(180deg,#e04a40,#a50f14);box-shadow:inset 0 0 2px rgba(255,255,255,.6)}
.hamb:hover{background:linear-gradient(180deg,#f06a60,#b8141a)}
.hamb svg{width:18px;height:18px;display:block}
.navseg .xpbtn{font-weight:700;min-width:2.2rem}
.tp-group{margin-bottom:12px;border-radius:6px 6px 0 0;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tp-head{margin:0;padding:.35rem .6rem;font-size:.85rem;font-weight:700;color:var(--grp-ink);
  background:linear-gradient(90deg,var(--grp-head-a),var(--grp-head-b))}
.tp-body{background:var(--grp-body);padding:.4rem}
.search{width:100%;padding:.25rem .4rem;border:1px solid var(--edge);background:var(--field);border-radius:0}
.tp-body ul{list-style:none;margin:0;padding:0}
.tp-body li button{display:flex;align-items:center;gap:.45rem;width:100%;text-align:left;background:none;border:1px solid transparent;
  padding:.3rem .35rem;cursor:pointer;border-radius:2px;font-size:.9rem;line-height:1.2}
.tp-body li button:hover{border-color:var(--edge-soft);background:var(--win-2)}
.tp-body li button[aria-current="true"]{background:var(--red);color:var(--sel-ink);border-color:var(--red-dark)}
.tp-body li button .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.tp-body li small{font-size:.75rem;opacity:.75}
.thumb{flex:none;width:28px;height:28px;border:1px solid var(--edge);background:#151413;color:#fbfaf7;display:grid;place-items:center;
  font-weight:700;font-size:.72rem;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fav-mark{color:var(--gold)}
[aria-current="true"] .fav-mark{color:var(--sel-ink)}
.addchar{display:flex;gap:.3rem;margin-top:.5rem;flex-wrap:wrap}
.addchar input{flex:1;min-width:0;padding:.25rem .4rem;border:1px solid var(--edge);background:var(--field)}
.hint{color:var(--muted);font-size:.85rem;margin:.5rem 0}

/* detail */
main{padding:clamp(.6rem,2vw,1.4rem);padding-bottom:5rem;min-width:0;background:var(--win);container-type:inline-size}
.dhead{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding-bottom:.6rem;margin-bottom:.8rem;border-bottom:1px solid var(--edge-soft)}
.dhead h2{margin:0;font-size:1.35rem;flex:1 1 auto;min-width:0}
.dhead .acts{display:flex;gap:.35rem;flex-wrap:wrap}
.seg{display:inline-flex}
.seg .xpbtn{border-radius:0}
.seg .xpbtn:first-child{border-radius:3px 0 0 3px}
.seg .xpbtn:last-child{border-radius:0 3px 3px 0;border-left:0}
.favchar[aria-pressed="true"]{background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:var(--red-light);border-color:var(--red);font-weight:700}
.edit-panel{border:1px solid var(--edge-soft);background:var(--win-2);padding:.6rem;margin-bottom:1rem;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.edit-panel input[type=text]{padding:.25rem .4rem;border:1px solid var(--edge);background:var(--field);min-width:0}
.edit-panel .lbl{font-weight:700;font-size:.85rem;margin-right:.2rem}
#imgMsg{font-size:.85rem;color:var(--muted)}

.chips{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.6rem}
.group h3{font-size:1rem;color:var(--red-light);margin:1rem 0 .2rem;padding-bottom:.15rem;border-bottom:1px solid var(--red)}
.group h3 button{all:unset;cursor:pointer;text-decoration:underline}
.moves{list-style:none;margin:0;padding:0}
.move{display:grid;grid-template-columns:auto minmax(120px,1fr) auto;gap:.35rem .6rem;align-items:center;padding:.5rem 0;border-bottom:1px dotted var(--edge-soft)}
.move .name{font-weight:700}
.move .name small{color:var(--muted);font-weight:400;font-size:.8rem;margin-left:.3rem}
.move .note{display:block;color:var(--muted);font-weight:400;font-size:.82rem}
.move .row-tools{grid-column:1/-1;display:flex;gap:.3rem}
.star{background:none;border:0;cursor:pointer;font-size:1.3rem;line-height:1;padding:0 .15rem;color:var(--muted)}
.star:hover,.star[aria-pressed="true"]{color:var(--gold)}
.seq{display:flex;flex-wrap:wrap;gap:.25rem;align-items:center;justify-content:flex-end}
.k{display:inline-grid;place-items:center;min-width:2rem;height:2rem;padding:0 .3rem;font-weight:700;line-height:1}
.k.dir{border-radius:3px;border:1px solid var(--edge);color:var(--ink);background:linear-gradient(180deg,var(--btn-a),var(--btn-b));
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.k.coin{border-radius:50%;width:2rem;padding:0;color:var(--coin-ink);font-size:.95rem;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.3)}
.k.punch{background:var(--red)} .k.kick{background:var(--kick)} .k.neutral{background:var(--neutral)}
.k.txt{border-radius:3px;border:1px solid var(--edge);font-size:.8rem}
.k.word{border-radius:3px;border:1px dashed var(--edge);color:var(--muted);font-size:.8rem}
.plus{color:var(--muted);font-weight:700}
.arr{width:1.3em;height:1.3em;display:block}
.arr-in{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.22em;margin:0 .05em}
.legend{display:flex;gap:.4rem .9rem;flex-wrap:wrap;color:var(--muted);font-size:.82rem;margin-top:1.4rem;padding-top:.6rem;border-top:1px solid var(--edge-soft)}
.legend > span{display:inline-flex;align-items:center;gap:.3rem}
.legend .k{min-width:1.5rem;height:1.5rem;font-size:.75rem}
.legend .k.coin{width:1.5rem}
.k.pill{border-radius:7px;background:var(--kick);color:#fff;font-size:.78rem;padding:0 .45rem;box-shadow:inset 0 -2px 0 rgba(0,0,0,.3)}
.k.ps{background:#1e1e1e}
.k.pill.ac-punch{background:var(--red)} .k.pill.ac-kick{background:var(--kick)} .k.pill.ac-neutral{background:var(--neutral)}
.k.ps svg,.k.ps-in{display:block;width:62%;height:62%}
.k.ps.ps-SQ{color:#f08ccf} .k.ps.ps-TR{color:#2fcf9f} .k.ps.ps-CI{color:#ff5a4f} .k.ps.ps-CR{color:#7fa2ff}
.k.xb-A{background:#4e9d2a} .k.xb-B{background:#d93a30} .k.xb-X{background:#2a68cf} .k.xb-Y{background:#e6ac00;color:#1b1b1b}
.btn-in{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.18em;margin:0 .05em}
.ctrlseg{display:flex;flex-direction:column;gap:3px}
.ctrlseg .xpbtn{text-align:left;font-size:.85rem;padding:.25rem .5rem}
.linkbtn{background:none;border:0;padding:.3rem 0 0;color:var(--red-light);text-decoration:underline;cursor:pointer;font-size:.8rem}
#ctrlDlg .maprow{display:grid;grid-template-columns:1fr auto;gap:.5rem;align-items:center;padding:.3rem 0;border-bottom:1px dotted var(--edge-soft)}
#ctrlDlg select{padding:.2rem .3rem;border:1px solid var(--edge);background:var(--field);min-width:7rem}

.moveform{margin-top:1.2rem;border:1px solid var(--edge);background:var(--win-2)}
.moveform h3{margin:0;padding:.3rem .6rem;font-size:.9rem;color:#fff;background:linear-gradient(180deg,#d42a22,#9b0d12)}
.moveform .inner{padding:.7rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.5rem}
.fields label{display:flex;flex-direction:column;gap:.15rem;font-weight:700;font-size:.85rem}
.fields input{padding:.3rem .4rem;border:1px solid var(--edge);background:var(--field);font-weight:400}
.keypad{display:flex;flex-wrap:wrap;gap:.3rem;margin:.6rem 0}
.keypad button{min-width:2.4rem;height:2.4rem;border:1px solid var(--edge);border-radius:3px;cursor:pointer;font-weight:700;
  background:linear-gradient(180deg,var(--btn-a),var(--btn-b))}
.keypad button.kp-punch{color:var(--red-light)} .keypad button.kp-neutral{color:var(--muted)}
.keypad .sep{width:1px;background:var(--edge-soft);margin:0 .15rem}
.preview{min-height:2.2rem;display:flex;align-items:center;margin:.5rem 0}
.formbtns{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.empty{padding:1.5rem 0;color:var(--muted);max-width:44ch}
.empty strong{color:var(--ink)}
.subhead{font-size:1rem;color:var(--red-light);margin:0 0 .5rem}
.favchars{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1.2rem}
.favchars .xpbtn{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .7rem .3rem .3rem;font-weight:700}

/* card */
.card{max-width:580px;margin:0 auto;background:var(--card-paper);color:var(--card-ink);padding:14px 14px 22px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);font-family:Calibri, Carlito, "Segoe UI", Arial, sans-serif;font-size:1.02rem}
.card-head{display:grid;grid-template-columns:64px 1fr;border:2px solid var(--card-edge)}
.card-pic{grid-row:1/3;background:var(--card-bar);color:var(--card-bar-ink);display:grid;place-items:center;font-weight:700;font-size:1.4rem;min-height:64px;overflow:hidden}
.card-pic img{width:100%;height:100%;object-fit:cover;display:block}
.card-name{margin:0;text-align:center;font-weight:700;font-size:1.2rem;padding:.15rem .4rem;background:var(--card-paper);color:var(--card-ink)}
.card-bar{background:var(--card-bar);color:var(--card-bar-ink);text-align:center;font-weight:700;font-size:1.1rem;padding:.15rem .4rem;margin:0}
.card-sec{border-left:2px solid var(--card-edge);border-right:2px solid var(--card-edge)}
.card-sec > .card-bar{border-top:2px solid var(--card-edge)}
.card ul{list-style:none;margin:0;padding:0}
.card-row{background:var(--card-row);color:var(--card-ink);border-bottom:2px solid var(--card-edge);padding:.2rem .35rem;line-height:1.3}
.card-sec.combos{background:var(--card-bar);border-bottom:2px solid var(--card-edge)}
.card-sec.morphs ul{display:grid;grid-template-columns:1fr 1fr;column-gap:2px;background:var(--card-edge)}
.card-sec:last-child.combos{padding-bottom:3rem}
.card-sec.combos .card-row{background:var(--card-bar);color:var(--card-bar-ink);font-weight:700;border-bottom:2px solid var(--card-bar-ink)}
.cardtools{display:flex;gap:.5rem;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:1rem}
#dlMsg{color:var(--muted);font-size:.85rem}
@container (min-width:700px){
  .card{max-width:660px;font-size:1.22rem;padding:18px 18px 26px}
  .card-head{grid-template-columns:80px 1fr}
  .card-pic{min-height:80px;font-size:1.7rem}
  .card-name{font-size:1.45rem}
  .card-bar{font-size:1.3rem}
}
@container (max-width:360px){
  .card{padding:6px 6px 12px;font-size:.78rem}
  .card-head{grid-template-columns:44px 1fr}
  .card-pic{min-height:44px;font-size:1rem}
  .card-name{font-size:.92rem}
  .card-bar{font-size:.85rem}
  .move{grid-template-columns:auto 1fr}
  .seq{grid-column:1/-1;justify-content:flex-start}
  .k{min-width:1.7rem;height:1.7rem} .k.coin{width:1.7rem}
}

/* pending + dialogs */
.pending{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:center;
  padding:.5rem 1rem;padding-bottom:calc(.5rem + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,#3a3a3a,#111);color:#fff;border-top:2px solid var(--red)}
.pending p{margin:0;font-weight:700}
.pending .xpbtn{color:var(--ink)}
#saveMsg{color:#ff8a80;font-weight:700}
dialog{border:3px solid var(--red-dark);border-radius:8px 8px 0 0;padding:0;background:var(--win);color:var(--ink);width:min(620px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog .titlebar{margin:0;border-radius:6px 6px 0 0;border:0}
dialog .dbody{padding:.8rem}
dialog textarea{width:100%;height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;border:1px solid var(--edge);background:var(--field);padding:.4rem}
#dataMsg{min-height:1.3em;font-weight:700}
#imgDlg img{display:block;max-width:100%;max-height:62vh;margin:0 auto .8rem}

body:not(.editing) .edit-only{display:none !important}

@media (max-width:560px){
  .desktop{padding:0}
  .window{border-radius:0;border-left:0;border-right:0;min-height:100vh}
  .titlebar{border-radius:0}
  .tbtns{display:none}
  body{font-size:14px}
  .dhead h2{font-size:1.1rem;flex-basis:100%}
}
</style>
</head>
<body>
<p id="boot" style="padding:2rem 1.2rem;font-size:1.2rem;margin:0;color:#ddd">Cargando el códice…</p>
<template id="shell"><div class="desktop">
<div class="window">
  <div class="titlebar"><button class="hamb" id="menuBtn" aria-label="Abrir menú de luchadores" aria-expanded="false" aria-controls="sidePanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button><span class="ticon" aria-hidden="true">⚔️</span><h1 class="ttitle" style="margin:0">Códice del Torneo</h1>
    <span class="tbtns" aria-hidden="true"><i>_</i><i>□</i><i class="x">×</i></span></div>
  <div class="toolbar" hidden>
    <button class="xpbtn" id="editBtn" aria-pressed="false" hidden>Editar</button>
    <button class="xpbtn edit-only" id="dataBtn">Copia de seguridad</button>
    <span class="spacer"></span>
  </div>
  <div class="body">
    <div class="scrim" id="scrim"></div>
    <nav class="taskpane" id="sidePanel" aria-label="Menú de luchadores" inert>
      <div class="tp-top"><span>Menú</span><button id="menuClose" aria-label="Cerrar menú">×</button></div>
      <section class="tp-group"><h2 class="tp-head">Mi control</h2><div class="tp-body">
        <div class="ctrlseg" role="group" aria-label="Elegir control" id="ctrlSeg">
          <button class="xpbtn" data-ctrl="sega">Sega</button>
          <button class="xpbtn" data-ctrl="ps">PlayStation</button>
          <button class="xpbtn" data-ctrl="xbox">Xbox</button>
          <button class="xpbtn" data-ctrl="arcade">Arcade (HP, LK…)</button>
        </div>
        <button class="linkbtn" id="ctrlCustom">Personalizar botones</button>
      </div></section>
      <section class="tp-group"><h2 class="tp-head">Favoritos</h2><div class="tp-body"><ul id="favList"></ul></div></section>
      <section class="tp-group"><h2 class="tp-head">Luchadores</h2><div class="tp-body">
        <label class="sr" for="search">Buscar personaje</label>
        <input class="search" id="search" type="search" placeholder="Buscar">
        <ul id="rosterList" style="margin-top:.35rem"></ul>
        <form class="addchar edit-only" id="addCharForm">
          <label class="sr" for="newChar">Nombre del nuevo personaje</label>
          <input id="newChar" placeholder="Nuevo personaje" autocomplete="off">
          <button class="xpbtn primary">Agregar</button>
        </form>
      </div></section>
    </nav>
    <main id="detail" aria-live="polite"></main>
  </div>
  <div class="statusbar"><span id="statusL"></span><span id="statusR"></span></div>
</div>
</div>
<div class="pending" id="pendingBar" hidden>
  <p>Tenés cambios que todavía no ven los demás.</p>
  <button class="xpbtn primary" id="saveAll">Guardar para todos</button>
  <button class="xpbtn" id="discardAll">Descartar cambios</button>
  <span id="saveMsg" role="status"></span>
</div>
<dialog id="ctrlDlg">
  <div class="titlebar"><span class="ttitle" id="ctrlDlgTitle">Personalizar botones</span></div>
  <div class="dbody">
    <p class="hint">Elegí qué botón de tu control hace cada acción. Se guarda solo en este dispositivo.</p>
    <div id="ctrlRows"></div>
    <div class="formbtns" style="margin-top:.8rem">
      <button class="xpbtn primary" id="ctrlDone">Listo</button>
      <button class="xpbtn" id="ctrlReset">Restablecer</button>
    </div>
  </div>
</dialog>
<dialog id="imgDlg">
  <div class="titlebar"><span class="ttitle">Ficha lista</span></div>
  <div class="dbody">
    <p class="hint">Tocá “Descargar”. Si tu celular no la guarda, mantené apretada la imagen y elegí “Guardar imagen”.</p>
    <img id="imgOut" alt="Imagen de la ficha">
    <div class="formbtns"><a class="xpbtn primary" id="imgDl" href="#" download="ficha.png" style="text-decoration:none">Descargar</a><button class="xpbtn" id="closeImg">Cerrar</button></div>
  </div>
</dialog>
<dialog id="dataDlg">
  <div class="titlebar"><span class="ttitle">Copia de seguridad</span></div>
  <div class="dbody">
    <p class="hint">Copiá este texto y guardalo en un lugar seguro, o pegá una copia anterior para restaurarla.</p>
    <textarea id="dataText" spellcheck="false" aria-label="Datos en formato JSON"></textarea>
    <p id="dataMsg" role="status"></p>
    <div class="formbtns">
      <button class="xpbtn primary" id="copyData">Copiar</button>
      <button class="xpbtn" id="loadData">Restaurar desde el texto</button>
      <button class="xpbtn" id="closeData">Cerrar</button>
    </div>
  </div>
</dialog>
</template>

<script id="app">window.addEventListener("error", function(e){ var b = document.getElementById("boot"); if (b) b.textContent = "No se pudo abrir el códice. Error: " + (e && e.message ? e.message : "desconocido"); });

const psSVG = (k, cls) => {
  const shape = { SQ:'<rect x="5.5" y="5.5" width="13" height="13" rx="1.5"/>', TR:'<path d="m12 4.5 8 14h-16z"/>',

const saveCtrl = () => { try { localStorage.setItem("codice-ctrl-v1", JSON.stringify(ctrl)); } catch(e) {} };
const curMap = () => Object.assign({}, PROFILES[ctrl.profile].def, ctrl.maps[ctrl.profile] || {});
const keyFor = letter => curMap()[ACT_OF[letter]];
const keyName = k => ctrl.profile === "ps" && PS_NAMES[k] ? PS_NAMES[k] : k;

  const p = ctrl.profile;
  if (p === "ps" && PS_NAMES[k]) return `<span class="k coin ps ps-${k}" title="${PS_NAMES[k]}">${psSVG(k, "")}</span>`;
  if (p === "xbox" && /^[ABXY]$/.test(k)) return `<span class="k coin xb-${k}">${k}</span>`;

  if (p === "sega" && k.length === 1 && k !== "L" && k !== "R") return `<span class="k coin ${ACT_CLASS[act]}">${k}</span>`;

const btnHTML = letter => keyHTML(keyFor(letter), ACT_OF[letter]);

const FAVS_ID = "__favs";

function renderInput(str){
  const s = String(str||"");
  const parts = s.split(/(\[[^\]]*\])/).map(seg => {
    if (/^\[.*\]$/.test(seg)) { const w = seg.slice(1,-1).trim(); return w ? `<span class="k word">${esc(w)}</span>` : ""; }
    return seg.toUpperCase().replace(/([+\-])/g," $1 ").split(/[\s,]+/).filter(Boolean).map(t => {
      if (DIRS[t]) return `<span class="k dir" title="${DIR_NAMES[DIRS[t]]}">${arrowSVG(DIRS[t])}</span>`;
      if (BTN[t]) return btnHTML(t);
      if (t === "+" || t === "-") return `<span class="plus">${t}</span>`;
      return `<span class="k txt">${esc(t)}</span>`;

  return `<span class="seq" role="img" aria-label="${esc(mapPlain(s.replace(/[\[\]]/g,"")))}">${parts}</span>`;

  const cats = catOrder(c.moves);

}

const KEYPAD = [["←","→","↑","↓","↖","↗","↙","↘"],["X","A","Z","C","B","Y"],["+","-"]];

function insertKey(input, k){
  let v = input.value.replace(/\s+$/,"");
  if (k === "back") v = v.replace(/(\s*[,+\-]?\s*)(\[[^\]]*\]|[^\s,+\-\[\]]+|[+\-])$/, "");
  else if (!v) v = (k === "+" || k === "-") ? "" : k;
  else if (k === "+" || k === "-" || /[+\-]$/.test(v)) v += " " + k;
  else v += ", " + k;
  input.value = v;
  input.dispatchEvent(new Event("input"));
}

/* image upload: crop to square, then store as an asset */
function readAsDataURL(file){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function loadImg(src){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
async function squareBlob(file){
  const img = await loadImg(await readAsDataURL(file));
  const S = 320, side = Math.min(img.naturalWidth, img.naturalHeight);
  const cv = document.createElement("canvas"); cv.width = S; cv.height = S;
  cv.getContext("2d").drawImage(img, (img.naturalWidth-side)/2, (img.naturalHeight-side)/2, side, side, 0, 0, S, S);
  return await new Promise(res => cv.toBlob(res, "image/jpeg", 0.9));
}
async function uploadImage(c, file){
  const msg = document.getElementById("imgMsg");
  const assets = await use("assets");
  if (!assets) { if (msg) msg.textContent = "Para subir imágenes abrí la app desde su link con permiso de edición."; return; }
  if (msg) msg.textContent = "Subiendo…";
  try {
    let blob = null;
    try { blob = await squareBlob(file); } catch(e) {}
    const r = blob ? await assets.upload(blob, { type: "image/jpeg" }) : await assets.upload(file);
    c.img = r.id; commit();
  } catch (err) {
    const code = err && err.code;
    if (msg) msg.textContent = code === "too_large" ? "La imagen es demasiado grande." : code === "unsupported_type" ? "Ese tipo de archivo no se puede usar. Probá con JPG o PNG." : "No se pudo subir la imagen. Probá de nuevo.";
  }
}

/* fixed-size card image */
function cardCanvas(c, pic){
  const W = CARD_W, H = CARD_H, PAD = 30, B = 4;
  const FONT = '"Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif';
  const paper = "#fbfaf7", rowBg = "#e7e5e0", ink = "#151413", bar = "#151413", barInk = "#fbfaf7";
  const meas = document.createElement("canvas").getContext("2d");
  const innerX = PAD + B, innerW = W - 2*PAD - 2*B;
  const cats = catOrder(c.moves);
  function atoms(str){
    const out = [];
    String(str).split(/([←→↑↓↖↗↙↘\uE001-\uE004])/).forEach(p => {
      if (!p) return;
      if (ARROW_ROT[p] !== undefined || PUA_PS[p]) out.push({ a:p });
      else p.split(/(\s+)/).forEach(w => { if (w) out.push(/^\s+$/.test(w) ? { sp:true } : { t:w }); });
    });
    return out;
  }
  function wrap(str, bold, FS, maxW){
    meas.font = `${bold?"700":"400"} ${FS}px ${FONT}`;
    const spW = meas.measureText(" ").width, aw = FS*0.95;
    const units = []; let u = [];
    atoms(str).forEach(x => { if (x.sp) { if (u.length) units.push(u); u = []; } else u.push(x); });
    if (u.length) units.push(u);
    const lines = []; let line = [], lw = 0;
    units.forEach(un => {
      const w = un.reduce((s,x) => s + (x.a ? aw : meas.measureText(x.t).width), 0);
      if (line.length && lw + spW + w > maxW) { lines.push(line); line = []; lw = 0; }
      if (line.length) { line.push({ sp:true }); lw += spW; }
      un.forEach(x => line.push(x)); lw += w;
    });
    if (line.length) lines.push(line);
    return lines;
  }
  function layout(FS){
    const LH = Math.round(FS*1.3), HEAD_H = Math.round(FS*2), BAR_H = Math.round(FS*1.7), RP = Math.max(4, Math.round(FS*0.3));
    const rowH = n => n*LH + 2*RP - (LH-FS)/2;
    const sections = cats.map((cat, i) => {
      const combo = cat === "Combos";
      const cols = cat === "Transformaciones" ? 2 : 1;
      const colW = (innerW - (cols-1)*B) / cols;
      const rows = c.moves.filter(m => m.cat === cat).map(m => wrap(combo
        ? mapCanvas(plainInput(m.input)) + " (" + m.name.replace(/^Combo\s*/i,"") + ")" + mapCanvas(plainNote(m.note))
        : m.name + ": " + mapCanvas(plainInput(m.input) + plainNote(m.note)), combo, FS, colW - 2*RP));
      const bands = [];
      for (let k = 0; k < rows.length; k += cols) {
        const grp = rows.slice(k, k+cols);
        bands.push({ grp, h: Math.max(...grp.map(r => rowH(r.length))) });
      }
      return { cat, combo, cols, colW, title: i > 0, bands };
    });
    let h = PAD + B + HEAD_H + BAR_H;
    sections.forEach(s => { if (s.title) h += BAR_H + B; s.bands.forEach(bd => { h += bd.h + B; }); });
    return { FS, LH, HEAD_H, BAR_H, RP, sections, h: h + PAD + B };
  }
  let L = null;
  for (let fs = 32; fs >= 12; fs--) { L = layout(fs); if (L.h <= H - 30) break; }
  const { FS, LH, HEAD_H, BAR_H, RP, sections } = L;

  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = paper; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = bar; ctx.fillRect(PAD, PAD, W-2*PAD, H-2*PAD);
  let y = PAD + B;
  const PIC = HEAD_H + BAR_H;
  if (pic) {
    const side = Math.min(pic.naturalWidth, pic.naturalHeight);
    ctx.drawImage(pic, (pic.naturalWidth-side)/2, (pic.naturalHeight-side)/2, side, side, innerX, y, PIC, PIC);
  } else {
    ctx.fillStyle = barInk; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `700 ${Math.round(PIC*0.38)}px ${FONT}`; ctx.fillText(initials(c), innerX + PIC/2, y + PIC/2);
  }
  const hx = innerX + PIC + B, hw = innerW - PIC - B;
  ctx.fillStyle = paper; ctx.fillRect(hx, y, hw, HEAD_H);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = ink; ctx.font = `700 ${Math.round(FS*1.15)}px ${FONT}`; ctx.fillText(c.name.toUpperCase(), hx + hw/2, y + HEAD_H/2 + 1);
  ctx.fillStyle = barInk; ctx.font = `700 ${Math.round(FS*1.05)}px ${FONT}`;
  ctx.fillText(sections[0] ? (CAT_TITLES[sections[0].cat]||sections[0].cat) + ":" : "", hx + hw/2, y + HEAD_H + BAR_H/2);
  y += HEAD_H + BAR_H;
  function psShape(x, cy, size, ch, color){
    const k = PUA_PS[ch];
    ctx.save(); ctx.translate(x + size/2, cy); ctx.scale(size/24, size/24); ctx.translate(-12, -12);
    ctx.strokeStyle = color; ctx.lineWidth = 2.7; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.beginPath();
    if (k === "SQ") ctx.rect(5.5, 5.5, 13, 13);
    else if (k === "TR") { ctx.moveTo(12, 4.5); ctx.lineTo(20, 18.5); ctx.lineTo(4, 18.5); ctx.closePath(); }
    else if (k === "CI") ctx.arc(12, 12, 7.3, 0, Math.PI*2);
    else { ctx.moveTo(6.5, 6.5); ctx.lineTo(17.5, 17.5); ctx.moveTo(17.5, 6.5); ctx.lineTo(6.5, 17.5); }
    ctx.stroke(); ctx.restore();
  }
  function arrow(x, cy, size, d, color){
    ctx.save(); ctx.translate(x + size/2, cy); ctx.rotate(ARROW_ROT[d]*Math.PI/180); ctx.scale(size/24, size/24);
    ctx.strokeStyle = color; ctx.lineWidth = 3.4; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(-8.5,0); ctx.lineTo(6.5,0); ctx.moveTo(0.5,-6.5); ctx.lineTo(7,0); ctx.lineTo(0.5,6.5); ctx.stroke();
    ctx.restore();
  }
  sections.forEach(s => {
    if (s.title) {
      y += B; ctx.fillStyle = barInk; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = `700 ${Math.round(FS*1.05)}px ${FONT}`;
      ctx.fillText((CAT_TITLES[s.cat]||s.cat) + ":", W/2, y + BAR_H/2); y += BAR_H;
    }
    const color = s.combo ? barInk : ink;
    s.bands.forEach(bd => {
      y += B;
      bd.grp.forEach((lines, gi) => {
        const x0 = innerX + gi*(s.colW + B);
        if (!s.combo) { ctx.fillStyle = rowBg; ctx.fillRect(x0, y, s.colW, bd.h); }
        ctx.fillStyle = color; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
        ctx.font = `${s.combo?"700":"400"} ${FS}px ${FONT}`;
        const spW = ctx.measureText(" ").width;
        lines.forEach((ln, li) => {
          let x = x0 + RP; const baseY = y + RP + FS*0.85 + li*LH;
          ln.forEach(a => {
            if (a.sp) x += spW;
            else if (a.a) { (PUA_PS[a.a] ? psShape : arrow)(x, baseY - FS*0.33, FS*0.95, a.a, color); x += FS*0.95; }
            else { ctx.fillText(a.t, x, baseY); x += ctx.measureText(a.t).width; }
          });
        });
      });
      y += bd.h;
      if (s.combo) { ctx.fillStyle = barInk; ctx.fillRect(innerX, y, innerW, 3); }
    });
  });
  return cv;
}
function toBlobSafe(cv){ return new Promise(res => { try { cv.toBlob(b => res(b), "image/png"); } catch(e) { res(null); } }); }
async function downloadCard(c, btn){
  const msgEl = document.getElementById("dlMsg");
  btn.disabled = true; if (msgEl) msgEl.textContent = "Preparando imagen…";
  let pic = null;
  if (c.img) { try { pic = await Promise.race([loadImg(imgSrc(c)), new Promise((_, rej) => setTimeout(rej, 5000))]); } catch(e) { pic = null; } }
  let cv = cardCanvas(c, pic), blob = await toBlobSafe(cv), url = null;
  if (!blob && pic) { cv = cardCanvas(c, null); blob = await toBlobSafe(cv); }
  const filename = c.name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + (ctrl.profile === "sega" ? "" : "-" + ctrl.profile) + "-ficha.png";
  const dl = await use("downloads");
  if (dl && blob) {
    try { await dl.save({ filename, data: blob }); if (msgEl) msgEl.textContent = "Listo."; btn.disabled = false; return; }
    catch (err) {
      const code = err && err.code;
      if (code === "declined") { if (msgEl) msgEl.textContent = ""; btn.disabled = false; return; }
      if (code === "rate_limited") { if (msgEl) msgEl.textContent = "Esperá unos segundos y probá de nuevo."; btn.disabled = false; return; }
    }
  }
  try { url = cv.toDataURL("image/png"); } catch(e) { url = cardCanvas(c, null).toDataURL("image/png"); }
  if (msgEl) msgEl.textContent = "";
  document.getElementById("imgOut").src = url;
  const dlA = document.getElementById("imgDl"); dlA.href = url; dlA.setAttribute("download", filename);
  const d = document.getElementById("imgDlg");
  d.showModal ? d.showModal() : d.setAttribute("open","");
  btn.disabled = false;
}

function updateChrome(){
  document.getElementById("editBtn").hidden = !canWrite;
  document.querySelector(".toolbar").hidden = !canWrite;
  if (!canWrite && editing) toggleEditing(false);
  document.getElementById("pendingBar").hidden = !(pending && canWrite);
}
function render(){ renderRoster(); renderDetail(); updateChrome(); }

function armDelete(btn, fn){
  if (btn.dataset.armed) { fn(); return; }
  btn.dataset.armed = "1"; const t = btn.textContent; btn.textContent = "¿Seguro? Tocá de nuevo";
  setTimeout(()=>{ if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = t; } }, 3000);
}

const menuBtn = document.getElementById("menuBtn"), sidePanel = document.getElementById("sidePanel");
function setMenu(open){
  document.body.classList.toggle("menu-open", open);
  menuBtn.setAttribute("aria-expanded", open);
  menuBtn.setAttribute("aria-label", open ? "Cerrar menú de luchadores" : "Abrir menú de luchadores");
  if (open) { sidePanel.removeAttribute("inert"); const cur = sidePanel.querySelector('[aria-current="true"]') || document.getElementById("search"); setTimeout(() => cur && cur.focus(), 60); }
  else { const had = sidePanel.contains(document.activeElement); sidePanel.setAttribute("inert", ""); if (had) menuBtn.focus(); }
}
menuBtn.addEventListener("click", () => setMenu(!document.body.classList.contains("menu-open")));
document.getElementById("menuClose").addEventListener("click", () => setMenu(false));
document.getElementById("scrim").addEventListener("click", () => setMenu(false));
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("menu-open") && !document.querySelector("dialog[open]")) setMenu(false); });
function onPick(e){
  const b = e.target.closest("button[data-id]"); if (!b) return;
  selectedId = b.dataset.id; catFilter = "Todos"; editingMoveId = null; render();
  setMenu(false);
  document.getElementById("detail").scrollTop = 0;
  if (window.scrollY > 200) window.scrollTo(0, 0);
}
document.getElementById("rosterList").addEventListener("click", onPick);
document.getElementById("favList").addEventListener("click", onPick);
document.getElementById("search").addEventListener("input", e => { query = e.target.value; renderRoster(); });

document.getElementById("detail").addEventListener("click", e => {
  const chip = e.target.closest("[data-cat]");
  if (chip) { catFilter = chip.dataset.cat; renderDetail(); return; }
  const nv = e.target.closest("[data-nav]");
  if (nv) {
    const list = sortedChars(); const i = list.findIndex(x => x.id === selectedId);
    const nx = list[(i + Number(nv.dataset.nav) + list.length) % list.length];
    if (nx) { selectedId = nx.id; catFilter = "Todos"; editingMoveId = null; render(); }
    return;
  }
  const vt = e.target.closest("[data-view]");
  if (vt && !vt.disabled) { viewMode = vt.dataset.view; lsSet(VIEW_KEY, viewMode); renderDetail(); return; }
  const go = e.target.closest("[data-goto]");
  if (go) {
    selectedId = go.dataset.goto; catFilter = "Todos";
    if (go.dataset.ficha) { viewMode = "ficha"; lsSet(VIEW_KEY, viewMode); }
    render(); return;
  }
  const b = e.target.closest("[data-act]"); if (!b) return;
  const c = current();
  switch (b.dataset.act) {
    case "favchar": favChars.has(c.id) ? favChars.delete(c.id) : favChars.add(c.id); saveFavChars(); render(); break;
    case "dlcard": downloadCard(c, b); break;
    case "fav": { const id = b.dataset.id; favs.has(id) ? favs.delete(id) : favs.add(id); saveFavs(); renderRoster(); renderDetail(); break; }
    case "rename": { const v = document.getElementById("renameInput").value.trim(); if (v && v !== c.name) { c.name = v; commit(); } break; }
    case "pickimg": document.getElementById("imgFile").click(); break;
    case "rmimg": delete c.img; commit(); break;
    case "delchar": armDelete(b, () => { data.chars = data.chars.filter(x=>x.id!==c.id); selectedId = (sortedChars()[0]||{}).id || null; commit(); }); break;
    case "editmove": editingMoveId = b.dataset.id; renderDetail(); document.getElementById("moveForm").scrollIntoView({block:"center"}); break;
    case "cancelmove": editingMoveId = null; renderDetail(); break;
    case "delmove": armDelete(b, () => { c.moves = c.moves.filter(m=>m.id!==b.dataset.id); commit(); }); break;
  }
});

document.getElementById("addCharForm").addEventListener("submit", e => {
  e.preventDefault();
  const inp = document.getElementById("newChar"); const name = inp.value.trim(); if (!name) return;
  const c = { id:uid(), name, moves:[] }; data.chars.push(c);
  selectedId = c.id; inp.value = ""; commit();
});

const editBtn = document.getElementById("editBtn");
function toggleEditing(on){
  editing = on; editingMoveId = null;
  document.body.classList.toggle("editing", editing);
  editBtn.setAttribute("aria-pressed", editing);
  editBtn.textContent = editing ? "Listo" : "Editar";
  renderDetail();
}
editBtn.addEventListener("click", () => toggleEditing(!editing));

function buildDoc(d){
  const css = document.getElementById("css").textContent;
  const app = document.getElementById("app").textContent;
  const json = JSON.stringify(d).replace(/</g, "\\u003c");
  return '<!DOCTYPE html>\n<html lang="es">\n<head>\n' + HEAD + '\n<style id="css">' + css + '</style>\n</head>\n<body>\n'
    + '<p id="boot" style="padding:2rem 1.2rem;font-size:1.2rem;margin:0;color:#ddd">Cargando el códice…</p>\n'
    + '<template id="shell">' + shellTpl.innerHTML + '</template>\n'
    + '<script id="codex-data" type="application/json">' + json + '<\/script>\n'
    + '<script id="app">' + app + '<\/script>\n</body>\n</html>\n';
}

const saveMsg = document.getElementById("saveMsg");
document.getElementById("saveAll").addEventListener("click", async e => {
  if (!artifactNs) { saveMsg.textContent = "Abrí la app desde su link para poder guardar."; return; }
  const btn = e.currentTarget; btn.disabled = true; saveMsg.textContent = "Guardando…";
  try { await artifactNs.publish(buildDoc(data)); saveMsg.textContent = "Guardado."; }
  catch (err) {
    const code = err && err.code;
    if (code === "conflict") saveMsg.textContent = "Había otra versión guardada antes. Recargando.";
    else if (["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].includes(code)) { canWrite = false; saveMsg.textContent = ""; updateChrome(); }
    else if (code === "rate_limited") saveMsg.textContent = "Demasiados guardados seguidos. Esperá un minuto.";
    else if (code === "too_large") saveMsg.textContent = "Hay demasiados datos para guardar de una vez.";
    else saveMsg.textContent = "No se pudo guardar. Probá de nuevo en un momento.";
    btn.disabled = false;
  }
});
document.getElementById("discardAll").addEventListener("click", e => armDelete(e.currentTarget, () => {
  lsDel(DRAFT_KEY); data = clone(base); pending = false; editingMoveId = null;
  if (selectedId !== FAVS_ID && !current()) selectedId = (sortedChars()[0]||{}).id || null;
  render();
}));

const closeDlg = d => d.close ? d.close() : d.removeAttribute("open");
document.getElementById("closeImg").addEventListener("click", () => closeDlg(document.getElementById("imgDlg")));
const dlg = document.getElementById("dataDlg"), txt = document.getElementById("dataText"), msg = document.getElementById("dataMsg");
document.getElementById("dataBtn").addEventListener("click", () => {
  txt.value = JSON.stringify(data, null, 2); msg.textContent = "";
  dlg.showModal ? dlg.showModal() : dlg.setAttribute("open","");
});
document.getElementById("closeData").addEventListener("click", () => closeDlg(dlg));
document.getElementById("copyData").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(txt.value); msg.textContent = "Copiado."; }
  catch(e) { txt.select(); msg.textContent = "Texto seleccionado: copialo con Ctrl+C o mantené apretado para copiar."; }
});
document.getElementById("loadData").addEventListener("click", () => {
  try {
    const d = JSON.parse(txt.value);
    if (!d || !Array.isArray(d.chars)) throw 0;
    d.chars.forEach(c => { c.id = c.id || uid(); c.name = String(c.name||"Sin nombre"); c.moves = (c.moves||[]).map(m => ({ id:m.id||uid(), name:m.name||"", cat:m.cat||"Otros", input:m.input||"", note:m.note||"" })); });
    data = { chars: d.chars }; selectedId = (sortedChars()[0]||{}).id || null; commit();
    msg.textContent = `Restaurado: ${data.chars.length} personajes. Tocá “Guardar para todos” para compartirlo.`;
  } catch(e) { msg.textContent = "Ese texto no es una copia válida. Pegá el contenido completo de una copia de seguridad."; }
});

function renderCtrl(){
  document.querySelectorAll("#ctrlSeg [data-ctrl]").forEach(b => b.setAttribute("aria-pressed", b.dataset.ctrl === ctrl.profile));
}
document.getElementById("ctrlSeg").addEventListener("click", e => {
  const b = e.target.closest("[data-ctrl]"); if (!b) return;
  ctrl.profile = b.dataset.ctrl; saveCtrl(); renderCtrl(); renderDetail();
});
const ctrlDlg = document.getElementById("ctrlDlg");
function renderCtrlRows(){
  const P = PROFILES[ctrl.profile], m = curMap();
  document.getElementById("ctrlDlgTitle").textContent = "Personalizar botones: " + P.name;
  document.getElementById("ctrlRows").innerHTML = ACTIONS.map(([act, label]) => `<div class="maprow">
    <label for="map-${act}">${label}</label>
    <select id="map-${act}" data-act="${act}">${P.keys.map(k => `<option value="${k}"${m[act]===k?" selected":""}>${esc(PS_NAMES[k] ? PS_NAMES[k][0].toUpperCase()+PS_NAMES[k].slice(1) : k)}</option>`).join("")}</select></div>`).join("");
}
document.getElementById("ctrlCustom").addEventListener("click", () => { renderCtrlRows(); ctrlDlg.showModal ? ctrlDlg.showModal() : ctrlDlg.setAttribute("open",""); });
document.getElementById("ctrlRows").addEventListener("change", e => {
  const sel = e.target.closest("select[data-act]"); if (!sel) return;
  ctrl.maps[ctrl.profile] = Object.assign({}, ctrl.maps[ctrl.profile] || {}, { [sel.dataset.act]: sel.value });
  saveCtrl(); renderDetail();
});
document.getElementById("ctrlReset").addEventListener("click", () => { delete ctrl.maps[ctrl.profile]; saveCtrl(); renderCtrlRows(); renderDetail(); });
document.getElementById("ctrlDone").addEventListener("click", () => ctrlDlg.close ? ctrlDlg.close() : ctrlDlg.removeAttribute("open"));
renderCtrl();
render();
var bootEl = document.getElementById("boot"); if (bootEl) bootEl.remove();

Promise.all([use("artifact"), use("user")]).then(async ([a, u]) => {
  artifactNs = a;
  let ok = false;
  try { ok = u ? await u.canEdit() : false; } catch(e) {}
  canWrite = !!(a && ok);
  updateChrome();
});
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
</html>
